<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>المنصة الرسمية | ميرا النوري</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --main-accent: #ff0050; 
      --glass-bg: rgba(255, 255, 255, 0.03);
      --dark-bg: #08080a;
      --card-radius: 18px;
      --text-muted: #808085;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Cairo', sans-serif;
      margin: 0;
      background-color: var(--dark-bg);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      background-image: radial-gradient(circle at 50% -20%, #2a0f18 0%, #08080a 60%);
    }

    /* خلفية النقاط الاحترافية */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1.5px, transparent 1.5px);
      background-size: 25px 25px;
      z-index: -1;
      pointer-events: none;
    }

    header {
      width: 100%;
      padding: 25px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 500px;
    }

    .logo {
      font-weight: 800; font-size: 19px; letter-spacing: 1px;
      background: linear-gradient(to left, #fff, var(--main-accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .premium-badge {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      padding: 4px 12px; border-radius: 50px;
      background: linear-gradient(45deg, rgba(255,0,80,0.1), rgba(255,255,255,0.05));
      border: 1px solid rgba(255,0,80,0.3); color: var(--main-accent);
      box-shadow: 0 0 15px rgba(255, 0, 80, 0.1);
    }

    /* صندوق البحث */
    .search-container {
      width: 90%; max-width: 420px; position: relative; margin-bottom: 25px;
    }

    #searchInput {
      width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
      padding: 14px 45px 14px 20px; border-radius: 12px; color: white; font-size: 14px; transition: 0.3s;
    }

    #searchInput:focus { outline: none; border-color: var(--main-accent); background: rgba(255,255,255,0.06); }

    .search-container i { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: #444; }

    /* حاوية الفيديوهات */
    #videoWrapper {
      width: 100%; max-width: 450px; padding: 0 15px;
      display: flex; flex-direction: column; gap: 20px;
    }

    .video-card {
      background: rgba(255, 255, 255, 0.02); border-radius: var(--card-radius);
      border: 1px solid rgba(255,255,255,0.04); overflow: hidden;
      animation: fadeInUp 0.5s ease forwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .thumb-area { position: relative; cursor: pointer; overflow: hidden; }
    .thumb-area img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; transition: 0.5s; }
    .video-card:hover .thumb-area img { transform: scale(1.05); }

    .play-overlay {
      position: absolute; inset: 0; background: rgba(0,0,0,0.2);
      display: flex; justify-content: center; align-items: center;
    }

    .play-btn {
      width: 55px; height: 55px; background: var(--main-accent); border-radius: 50%;
      display: flex; justify-content: center; align-items: center; font-size: 18px;
      box-shadow: 0 8px 20px rgba(255, 0, 80, 0.4);
    }

    /* قسم التفاصيل */
    .info-area { padding: 12px 16px 18px 16px; }

    .meta-line { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }

    .badges-group { display: flex; gap: 6px; }

    .tag-ex { font-size: 10px; font-weight: 800; background: var(--main-accent); padding: 2px 8px; border-radius: 4px; }

    .tag-hd { font-size: 10px; font-weight: 600; color: #666; border: 1px solid #333; padding: 1px 6px; border-radius: 4px; }

    .time-left { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 5px; direction: ltr; }

    .time-left i { font-size: 10px; color: var(--main-accent); }

    .video-title { font-size: 17px; font-weight: 700; margin: 0; color: #efefef; line-height: 1.4; }

    /* نظام ترقيم الصفحات */
    .pagination {
      margin: 40px 0; display: flex; gap: 8px; justify-content: center; align-items: center;
    }

    .page-node {
      min-width: 40px; height: 40px; border-radius: 10px; 
      background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05);
      color: #888; cursor: pointer; font-weight: 700; transition: 0.3s;
      display: flex; justify-content: center; align-items: center;
    }

    .page-node:hover { background: rgba(255,255,255,0.08); color: #fff; }

    .page-node.active {
      background: var(--main-accent); border-color: var(--main-accent); color: #fff;
      box-shadow: 0 5px 15px rgba(255, 0, 80, 0.3);
    }

    #noResults { display: none; text-align: center; padding: 80px 20px; color: var(--text-muted); }
  </style>
</head>
<body>

<header>
  <div class="logo">Sex 1 iraq</div>
  <div class="premium-badge">الاول على العراق</div>
</header>

<div class="search-container">
  <i class="fas fa-search"></i>
  <input type="text" id="searchInput" placeholder="البحث" />
</div>

<main id="videoWrapper"></main>

<nav class="pagination" id="paginationControls"></nav>

<div id="noResults">
  <i class="fas fa-folder-open" style="font-size: 40px; margin-bottom: 15px; opacity: 0.2;"></i>
  <p>لم نجد أي فيديو يطابق بحثك</p>
</div>

<script>
  /**
   * قاعدة بيانات الفيديوهات
   * أضف أي فيديو جديد هنا في الأعلى وسيظهر تلقائياً
   */
  const DATABASE = [
    { id: 06, title: "طالبة اعداديه تفرك - نودز", date: "2026-03-08T04:15:00+03:00", img: "https://sex1iraqi.site/wp-content/uploads/2026/03/1.jpg", link: "https://sex1iraqi.site/%d8%b7%d8%a7%d9%84%d8%a8%d8%a9-%d8%a7%d8%b9%d8%af%d8%a7%d8%af%d9%8a%d9%87-%d8%aa%d9%81%d8%b1%d9%83/" }
  ];

  let currentPage = 1;
  const videosPerPage = 30;
  let currentData = [...DATABASE];

  // دالة تحويل التاريخ إلى وقت نسبي احترافي
  function timeAgo(dateString) {
    const now = new Date();
    const past = new Date(dateString);
    const diff = now - past;

    const seconds = Math.floor(diff / 1000);
    const minutes = Math.floor(seconds / 60);
    const hours = Math.floor(minutes / 60);
    const days = Math.floor(hours / 24);
    const months = Math.floor(days / 30);
    const years = Math.floor(days / 365);

    if (diff < 0) return "قريباً";
    if (seconds < 60) return `منذ ثوانٍ`;
    if (minutes < 60) {
      if (minutes === 1) return "منذ دقيقة";
      if (minutes === 2) return "منذ دقيقتين";
      return `منذ ${minutes} دقيقة`;
    }
    if (hours < 24) {
      if (hours === 1) return "منذ ساعة";
      if (hours === 2) return "منذ ساعتين";
      return `منذ ${hours} ساعة`;
    }
    if (days < 30) {
      if (days === 1) return "منذ يوم";
      if (days === 2) return "منذ يومين";
      if (days <= 10) return `منذ ${days} أيام`;
      return `منذ ${days} يوم`;
    }
    if (months < 12) {
      if (months === 1) return "منذ شهر";
      if (months === 2) return "منذ شهرين";
      return `منذ ${months} أشهر`;
    }
    return years === 1 ? "منذ سنة" : `منذ ${years} سنة`;
  }

  // دالة بناء وعرض الفيديوهات
  function displayVideos() {
    const wrapper = document.getElementById('videoWrapper');
    const noResults = document.getElementById('noResults');
    wrapper.innerHTML = "";

    if (currentData.length === 0) {
      noResults.style.display = "block";
      document.getElementById('paginationControls').innerHTML = "";
      return;
    }
    noResults.style.display = "none";

    // حساب بداية ونهاية الصفحة
    const start = (currentPage - 1) * videosPerPage;
    const end = start + videosPerPage;
    const paginatedItems = currentData.slice(start, end);

    paginatedItems.forEach(video => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <div class="thumb-area" onclick="window.open('${video.link}')">
          <img src="${video.img}" alt="Thumbnail">
          <div class="play-overlay">
            <div class="play-btn"><i class="fas fa-play"></i></div>
          </div>
        </div>
        <div class="info-area">
          <div class="meta-line">
            <div class="badges-group">
              <span class="tag-ex">حصري</span>
              <span class="tag-hd">HD</span>
            </div>
            <div class="time-left">
              <span>${timeAgo(video.date)}</span>
              <i class="fa-solid fa-circle-check"></i>
            </div>
          </div>
          <h2 class="video-title">${video.title}</h2>
        </div>
      `;
      wrapper.appendChild(card);
    });

    setupPagination();
  }

  // دالة بناء أزرار الترقيم
  function setupPagination() {
    const pageContainer = document.getElementById('paginationControls');
    pageContainer.innerHTML = "";
    
    const pageCount = Math.ceil(currentData.length / videosPerPage);
    if (pageCount <= 1) return;

    for (let i = 1; i <= pageCount; i++) {
      const btn = document.createElement('div');
      btn.className = `page-node ${i === currentPage ? 'active' : ''}`;
      btn.innerText = i;
      btn.onclick = () => {
        currentPage = i;
        displayVideos();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      pageContainer.appendChild(btn);
    }
  }

  // محرك البحث الذكي
  document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase().trim();
    currentData = DATABASE.filter(v => v.title.toLowerCase().includes(term));
    currentPage = 1; // العودة للصفحة الأولى عند البحث
    displayVideos();
  });

  // تشغيل المنصة عند التحميل
  displayVideos();
  
  // تحديث التوقيت كل دقيقة ليبقى حياً
  setInterval(displayVideos, 60000);
</script>

</body>
</html>
